{% extends "layout.html" %}
{% block content %}
<section class="page-header">
  <div>
    <span class="eyebrow">Jogador</span>
    <h1>Editar jogador</h1>
    <p>Alterar a nota afeta novos sorteios. Partidas antigas mantêm a nota usada na escalação.</p>
  </div>
</section>

<section class="card narrow">
  <form method="post" class="stack-form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>
      Nome
      <input type="text" name="name" value="{{ player.name }}" required>
    </label>
    <label>
      Nota
      <input type="number" name="rating" min="0" max="10" step="0.1" value="{{ player.rating }}" required>
    </label>
    <label class="checkbox-line">
      <input type="checkbox" name="active" {% if player.active %}checked{% endif %}>
      Jogador ativo
    </label>
    <div class="actions">
      <button type="submit">Salvar</button>
      <a href="{{ next_url }}" class="button secondary">Voltar</a>
    </div>
  </form>
</section>
{% endblock %}
